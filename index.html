<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>weather app by ness</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="img/weather.svg">
</head>
<body>
    <header>
        <div class="logo"><a href="">nessMeteo <img src="img/weather.svg" alt="icon"></a></div>
    </header>
    <main>
        <section class="search">
            <form id="form">
                <input type="text" id="input" placeholder="Search...">
                <button>enter</button>
            </form>
        </section>
        <section class="weather">
            <div id="loadingCircle" class="loading-circle"></div>
    
            <h1 id="city"></h1>
            <p id="cords"></p>
            <div id="isDay"></div>
            <div id="temperature"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
